name: Sync slopkit2

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:

      # ============================================================
      # 1. Checkout YOUR repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Download upstream repository (root, no subfolder)
      # ============================================================
      - name: Download upstream slopkit
        run: |
          set -euo pipefail

          echo "Downloading upstream repository..."

          git clone \
            --depth 1 \
            https://github.com/jordyidk/slopkit.git \
            upstream

          echo "Download completed."

      # ============================================================
      # 3. Verify upstream exists and has index.html
      # ============================================================
      - name: Validate upstream folder
        run: |
          set -euo pipefail

          if [ ! -d "upstream" ]; then
            echo "::error::Upstream clone failed — directory missing."
            exit 1
          fi

          if [ ! -f "upstream/index.html" ]; then
            echo "::error::upstream/index.html is missing. Aborting."
            exit 1
          fi

          echo "upstream/index.html exists."

      # ============================================================
      # 4. Make sure upstream is NOT empty
      # ============================================================
      - name: Validate files
        run: |
          set -euo pipefail

          FILE_COUNT=$(find upstream -type f -not -path "upstream/.git/*" | wc -l)
          echo "Upstream contains $FILE_COUNT files."

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::Upstream is EMPTY. Aborting to protect your copy."
            exit 1
          fi

          echo "Folder contains files."

      # ============================================================
      # 5. Prepare a temporary copy (strip .git and symlinks)
      # ============================================================
      - name: Prepare new copy
        run: |
          set -euo pipefail

          rm -rf new-slopkit2

          # Copy everything except the .git folder
          rsync -a --exclude='.git' upstream/ new-slopkit2/

          # Remove any symlinks defensively
          find new-slopkit2 -type l -exec rm -f {} +

          echo "Temporary copy prepared."

      # ============================================================
      # 6. Replace slopkit2
      # ============================================================
      - name: Update slopkit2
        run: |
          set -euo pipefail

          rm -rf slopkit2
          mv new-slopkit2 slopkit2

          echo "slopkit2 updated."

      # ============================================================
      # 7. Stage files BEFORE checking for changes
      # ============================================================
      - name: Stage changes
        run: |
          set -euo pipefail

          git add slopkit2

          echo "Git status:"
          git status --short

      # ============================================================
      # 8. Determine whether anything changed
      # ============================================================
      - name: Check for changes
        id: changes
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
          fi

      # ============================================================
      # 9. Commit changes
      # ============================================================
      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: sync slopkit2 from upstream $(date -u +%Y-%m-%d)"

          echo "Committed."

      # ============================================================
      # 10. Push — rebase first to handle concurrent workflow runs
      # ============================================================
      - name: Push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "$GITHUB_REF_NAME"

          echo "Pushed successfully."

      # ============================================================
      # 11. Nothing changed
      # ============================================================
      - name: Already up to date
        if: steps.changes.outputs.changed == 'false'
        run: echo "slopkit2 is already up to date. Nothing to push."
