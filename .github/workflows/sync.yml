name: Sync slopkit2

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 15          # ← prevents hung clone from wasting quota

    steps:

      # ============================================================
      # 1. Checkout YOUR repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Download upstream repository
      # ============================================================
      - name: Download upstream slopkit2
        run: |
          set -euo pipefail

          echo "Downloading upstream repository..."

          git clone \
            --depth 1 \
            --filter=blob:none \
            --sparse \
            https://github.com/zecoxao/zecoxao.github.io.git \
            upstream

          cd upstream
          git sparse-checkout set slopkit2
          cd ..

          echo "Download completed."

      # ============================================================
      # 3. Verify slopkit2 exists
      # ============================================================
      - name: Validate upstream folder
        run: |
          set -euo pipefail

          if [ ! -d "upstream/slopkit2" ]; then
            echo "::error::Upstream slopkit2 folder does not exist."
            exit 1
          fi

          echo "slopkit2 folder exists."

      # ============================================================
      # 4. Make sure slopkit2 is NOT empty
      # ============================================================
      - name: Validate files
        run: |
          set -euo pipefail

          FILE_COUNT=$(find upstream/slopkit2 -type f | wc -l)
          echo "Upstream contains $FILE_COUNT files."

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::Upstream slopkit2 is EMPTY. Aborting to protect your copy."
            exit 1
          fi

          echo "Folder contains files."

      # ============================================================
      # 5. Make sure the website has index.html
      # ============================================================
      - name: Validate index.html
        run: |
          set -euo pipefail

          if [ ! -f "upstream/slopkit2/index.html" ]; then
            echo "::error::upstream/slopkit2/index.html is missing. Aborting."
            exit 1
          fi

          echo "index.html exists."

      # ============================================================
      # 6. Prepare a temporary copy (strip symlinks for safety)
      # ============================================================
      - name: Prepare new copy
        run: |
          set -euo pipefail

          rm -rf new-slopkit2

          # -a preserves times/perms but we explicitly dereference symlinks
          # to avoid committing dangling or malicious symlinks from upstream
          cp -aL upstream/slopkit2 new-slopkit2

          # Remove any remaining symlinks defensively
          find new-slopkit2 -type l -exec rm -f {} +

          echo "Temporary copy prepared."

      # ============================================================
      # 7. Replace slopkit2
      # ============================================================
      - name: Update slopkit2
        run: |
          set -euo pipefail

          rm -rf slopkit2
          mv new-slopkit2 slopkit2

          echo "slopkit2 updated."

      # ============================================================
      # 8. Stage files BEFORE checking for changes
      # ============================================================
      - name: Stage changes
        run: |
          set -euo pipefail

          git add slopkit2

          echo "Git status:"
          git status --short

      # ============================================================
      # 9. Determine whether anything changed
      # ============================================================
      - name: Check for changes
        id: changes
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
          fi

      # ============================================================
      # 10. Commit changes
      # ============================================================
      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "chore: sync slopkit2 from upstream $(date -u +%Y-%m-%d)"

          echo "Committed."

      # ============================================================
      # 11. Push — rebase first to handle concurrent workflow runs
      # ============================================================
      - name: Push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "$GITHUB_REF_NAME"

          echo "Pushed successfully."

      # ============================================================
      # 12. Nothing changed
      # ============================================================
      - name: Already up to date
        if: steps.changes.outputs.changed == 'false'
        run: echo "slopkit2 is already up to date. Nothing to push."
