name: Deploy website

on:
  # Only run after sync completes successfully — not on every push
  workflow_run:
    workflows: ["Sync slopkit2"]
    types:
      - completed
  # Allow manual deploys (validate step will catch missing slopkit2)
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # For automatic runs: only deploy if sync succeeded.
    # For manual runs: proceed and let validate catch any issues.
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          # Explicitly pull latest main so we get what sync just committed
          ref: main

      # ============================================================
      # 2. Verify website exists and is sane
      # ============================================================
      - name: Validate website
        run: |
          set -euo pipefail

          if [ ! -d "./slopkit2" ]; then
            echo "::error::slopkit2 does not exist."
            echo "::error::Run the 'Sync slopkit2' workflow manually first, then re-run deploy."
            exit 1
          fi

          if [ ! -f "./slopkit2/index.html" ]; then
            echo "::error::slopkit2/index.html does not exist."
            exit 1
          fi

          FILE_COUNT=$(find ./slopkit2 -type f | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::slopkit2 is empty."
            exit 1
          fi

          echo "Validation passed. Files found: $FILE_COUNT"

      # ============================================================
      # 3. Configure GitHub Pages
      # ============================================================
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ============================================================
      # 4. Package slopkit2 as the Pages artifact
      #
      # retention-days: 1 — artifacts are only needed until deployed;
      # keeping them longer wastes storage quota.
      # ============================================================
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: "./slopkit2"
          retention-days: 1

      # ============================================================
      # 5. Deploy to GitHub Pages
      # ============================================================
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5

      # ============================================================
      # 6. Print deployment URL to the job summary
      # ============================================================
      - name: Report deployment URL
        run: |
          echo "### Deployed successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
