name: Deploy website

on:
  # Run after the sync workflow completes — not on every push
  workflow_run:
    workflows: ["Sync slopkit2"]
    types:
      - completed
  # Still allow manual deploys
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "github-pages-deploy"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # Only deploy if the sync actually succeeded
    if: >
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Pull latest — including whatever sync just committed
          ref: main

      - name: Validate website
        run: |
          set -euo pipefail

          if [ ! -d "./slopkit2" ]; then
            echo "::error::slopkit2 directory does not exist."
            echo "::error::Has the sync workflow run at least once?"
            exit 1
          fi

          if [ ! -f "./slopkit2/index.html" ]; then
            echo "::error::slopkit2/index.html does not exist."
            exit 1
          fi

          FILE_COUNT=$(find ./slopkit2 -type f | wc -l)

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::slopkit2 is empty."
            exit 1
          fi

          echo "Validation passed. Files found: $FILE_COUNT"

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./slopkit2"
          retention-days: 1

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Report deployment URL
        run: |
          echo "### Deployed successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
