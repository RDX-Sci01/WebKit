name: Deploy website

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Prevent two deploys running simultaneously.
# cancel-in-progress: false means a queued deploy waits rather than being dropped.
concurrency:
  group: "github-pages-deploy"   # ← scoped name avoids collisions with other workflows
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15           # ← prevents a hung upload from burning quota

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:

      # ============================================================
      # 1. Checkout repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4

      # ============================================================
      # 2. Verify website exists and is sane
      # ============================================================
      - name: Validate website
        run: |
          set -euo pipefail

          if [ ! -d "./slopkit2" ]; then
            echo "::error::slopkit2 directory does not exist."
            exit 1
          fi

          if [ ! -f "./slopkit2/index.html" ]; then
            echo "::error::slopkit2/index.html does not exist."
            exit 1
          fi

          FILE_COUNT=$(find ./slopkit2 -type f | wc -l)

          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "::error::slopkit2 is empty."
            exit 1
          fi

          echo "Validation passed. Files found: $FILE_COUNT"

      # ============================================================
      # 3. Configure GitHub Pages
      # ============================================================
      - name: Setup Pages
        uses: actions/configure-pages@v5

      # ============================================================
      # 4. Package slopkit2 as the Pages artifact
      #
      # retention-days: 1 — artifacts are only needed until deployed;
      # keeping them longer wastes storage quota.
      # ============================================================
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: "./slopkit2"
          retention-days: 1

      # ============================================================
      # 5. Deploy to GitHub Pages
      # ============================================================
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      # ============================================================
      # 6. Print deployment URL to the job summary
      # ============================================================
      - name: Report deployment URL
        run: |
          echo "### Deployed successfully" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "URL: ${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
