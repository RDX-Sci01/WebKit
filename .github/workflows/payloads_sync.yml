name: Sync Payloads

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync-payloads:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:

      # ============================================================
      # 1. Checkout YOUR repository
      # ============================================================
      - name: Checkout repository
        uses: actions/checkout@v4.2.2
        with:
          fetch-depth: 0

      # ============================================================
      # 2. Validate slopkit2 exists before writing into it
      # ============================================================
      - name: Validate slopkit2 exists
        run: |
          set -euo pipefail

          if [ ! -d "slopkit2" ]; then
            echo "::error::slopkit2 directory does not exist."
            echo "::error::Run 'Sync slopkit2' first, then re-run this workflow."
            exit 1
          fi

          echo "slopkit2 exists."

      # ============================================================
      # 3. Fetch payloads.json directly from raw.githubusercontent.com
      # ============================================================
      - name: Fetch payloads manifest
        run: |
          set -euo pipefail

          echo "Fetching payloads.json from itsPLK/ps5-payloads-mirror..."

          curl -sSf \
            "https://raw.githubusercontent.com/itsPLK/ps5-payloads-mirror/main/payloads.json" \
            > /tmp/payloads.json

          PAYLOAD_COUNT=$(python3 -c "import json; print(len(json.load(open('/tmp/payloads.json'))))")
          echo "Payloads listed in manifest: $PAYLOAD_COUNT"

          if [ "$PAYLOAD_COUNT" -eq 0 ]; then
            echo "::error::payloads.json is empty. Aborting."
            exit 1
          fi

      # ============================================================
      # 4. Download all payloads into slopkit2/payloads/
      # ============================================================
      - name: Download payloads
        run: |
          set -euo pipefail

          PAYLOADS_DIR="slopkit2/payloads"

          rm -rf "$PAYLOADS_DIR"
          mkdir -p "$PAYLOADS_DIR"

          echo "Downloading payloads..."

          python3 << 'PYEOF'
          import json, subprocess, sys, os, hashlib

          payloads_dir = "slopkit2/payloads"

          with open("/tmp/payloads.json") as f:
              payloads = json.load(f)

          failed = []

          for p in payloads:
              name     = p["name"]
              filename = p["filename"]
              url      = p["url"]
              checksum = p.get("checksum", "")
              dest     = os.path.join(payloads_dir, filename)

              print(f"  -> {filename}")

              result = subprocess.run(
                  ["curl", "-sSfL", "-o", dest, url],
                  capture_output=True, text=True
              )

              if result.returncode != 0:
                  print(f"     ERROR downloading {filename}: {result.stderr.strip()}", file=sys.stderr)
                  failed.append(filename)
                  continue

              # Verify checksum if provided
              if checksum:
                  sha256 = hashlib.sha256(open(dest, "rb").read()).hexdigest()
                  if sha256 != checksum:
                      print(f"     CHECKSUM MISMATCH for {filename}", file=sys.stderr)
                      print(f"     Expected: {checksum}", file=sys.stderr)
                      print(f"     Got:      {sha256}", file=sys.stderr)
                      failed.append(filename)
                      os.remove(dest)
                      continue

              print(f"     OK ({os.path.getsize(dest):,} bytes)")

          if failed:
              print(f"\n::error::Failed to download: {', '.join(failed)}", file=sys.stderr)
              sys.exit(1)

          # Write manifest.json for the site to consume
          manifest = [
              {
                  "name":        p["name"],
                  "filename":    p["filename"],
                  "version":     p.get("version", ""),
                  "description": p.get("description", ""),
                  "last_update": p.get("last_update", ""),
                  "source":      p.get("source", ""),
                  "checksum":    p.get("checksum", ""),
              }
              for p in payloads
          ]

          with open(os.path.join(payloads_dir, "manifest.json"), "w") as f:
              json.dump(manifest, f, indent=2)

          print(f"\nAll {len(payloads)} payloads downloaded successfully.")
          PYEOF

          echo ""
          echo "Contents of slopkit2/payloads/:"
          ls -lh slopkit2/payloads/

      # ============================================================
      # 5. Stage changes
      # ============================================================
      - name: Stage changes
        run: |
          set -euo pipefail

          git add slopkit2/payloads

          echo "Git status:"
          git status --short

      # ============================================================
      # 6. Check for changes
      # ============================================================
      - name: Check for changes
        id: changes
        run: |
          set -euo pipefail

          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No changes detected — payloads already up to date."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "Changes detected."
          fi

      # ============================================================
      # 7. Commit
      # ============================================================
      - name: Commit changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          PAYLOAD_COUNT=$(python3 -c "import json; print(len(json.load(open('/tmp/payloads.json'))))")

          git commit -m "chore: sync payloads from mirror ($PAYLOAD_COUNT payloads) $(date -u +%Y-%m-%d)"

          echo "Committed."

      # ============================================================
      # 8. Push
      # ============================================================
      - name: Push changes
        if: steps.changes.outputs.changed == 'true'
        run: |
          set -euo pipefail

          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "$GITHUB_REF_NAME"

          echo "Pushed successfully."

      # ============================================================
      # 9. Summary
      # ============================================================
      - name: Job summary
        run: |
          echo "### Payload sync complete" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          python3 << 'PYEOF' >> "$GITHUB_STEP_SUMMARY"
          import json
          payloads = json.load(open('/tmp/payloads.json'))
          print(f"**{len(payloads)} payloads synced** from [itsPLK/ps5-payloads-mirror](https://github.com/itsPLK/ps5-payloads-mirror)\n")
          print("| Payload | Version | Updated |")
          print("|---|---|---|")
          for p in payloads:
              print(f"| {p['name']} | `{p.get('version','')}` | {p.get('last_update','')} |")
          PYEOF
