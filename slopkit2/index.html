<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>slopkit</title>
<link rel="preload" href="slopkit/cat.jpg" as="image">
<link rel="preload" href="slopkit/mmhmm-cats-ps5.gif" as="image">
<style>
 :root {
  --glass-bg: rgba(255,255,255,0.08);
  --glass-border: rgba(255,255,255,0.18);
  --glass-hover: rgba(255,255,255,0.14);
  --glass-shine: rgba(255,255,255,0.22);
  --glass-shadow: rgba(0,0,0,0.35);
  --glass-primary: rgba(59,226,255,0.18);
  --glass-primary-border: rgba(59,226,255,0.45);
  --glass-done: rgba(35,157,82,0.2);
  --glass-done-border: rgba(123,255,162,0.45);
}

html, body {
  margin: 0; padding: 0; height: 100%;
  background: radial-gradient(circle at 50% 28%, #18233a 0, #0c111b 44%, #07090e 100%);
  color: #c8ced8;
  font: 15px/1.5 "Segoe UI", system-ui, sans-serif;
  overflow: hidden;
}

#wrap {
  height: 100%;
  display: flex; flex-direction: column;
  align-items: center; justify-content: center;
  gap: 24px;
}

#cat {
  box-sizing: border-box; width: 150px; height: 150px; object-fit: cover;
  max-width: 34vw; max-height: 34vw;
  border: 1px solid var(--glass-border);
  border-radius: 22px;
  box-shadow: 0 8px 32px var(--glass-shadow), inset 0 1px 0 var(--glass-shine);
  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);
}

#actions {
  display: flex; flex-direction: column; gap: 12px;
  align-items: center; justify-content: center;
}

.action {
  box-sizing: border-box;
  display: inline-block; min-width: 190px;
  padding: 15px 32px;
  border-radius: 16px;
  border: 1px solid var(--glass-border);
  background: var(--glass-bg);
  backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  box-shadow:
    0 8px 32px var(--glass-shadow),
    inset 0 1px 0 var(--glass-shine),
    inset 0 -1px 0 rgba(0,0,0,0.15);
  color: rgba(255,255,255,0.9);
  font: 600 17px/1 "Segoe UI", system-ui, sans-serif;
  letter-spacing: 0.02em;
  text-align: center;
  text-decoration: none;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease, background 0.15s ease, border-color 0.15s ease;
  position: relative;
  overflow: hidden;
}

.action::before {
  content: '';
  position: absolute;
  inset: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.12) 0%, transparent 60%);
  pointer-events: none;
  border-radius: inherit;
}

.action:hover {
  background: var(--glass-hover);
  border-color: rgba(255,255,255,0.3);
  transform: translateY(-2px);
  box-shadow:
    0 16px 48px var(--glass-shadow),
    inset 0 1px 0 rgba(255,255,255,0.3),
    inset 0 -1px 0 rgba(0,0,0,0.15);
}

.action:focus {
  outline: none;
  border-color: rgba(255,255,255,0.4);
  box-shadow:
    0 0 0 3px rgba(91,158,255,0.25),
    0 16px 36px var(--glass-shadow),
    inset 0 1px 0 var(--glass-shine);
}

.action:active {
  transform: translateY(1px);
  box-shadow:
    0 4px 16px var(--glass-shadow),
    inset 0 1px 0 var(--glass-shine);
}

.action.primary {
  background: var(--glass-primary);
  border-color: var(--glass-primary-border);
  color: #d0f7ff;
  box-shadow:
    0 8px 32px rgba(0,100,180,0.3),
    0 0 0 1px var(--glass-primary-border),
    inset 0 1px 0 rgba(59,226,255,0.3),
    inset 0 -1px 0 rgba(0,0,0,0.2);
}

.action.primary::before {
  background: linear-gradient(135deg, rgba(59,226,255,0.18) 0%, transparent 60%);
}

.action.primary:hover {
  background: rgba(59,226,255,0.26);
  border-color: rgba(59,226,255,0.6);
  box-shadow:
    0 16px 48px rgba(0,100,200,0.4),
    0 0 24px rgba(59,226,255,0.15),
    inset 0 1px 0 rgba(59,226,255,0.4);
}

.action.done {
  background: var(--glass-done);
  border-color: var(--glass-done-border);
  color: #b6ffd2;
  pointer-events: none;
  box-shadow:
    0 8px 32px rgba(24,142,67,0.25),
    inset 0 1px 0 rgba(123,255,162,0.25),
    inset 0 -1px 0 rgba(0,0,0,0.15);
}

.action.done::before {
  background: linear-gradient(135deg, rgba(123,255,162,0.12) 0%, transparent 60%);
}

#status {
  min-height: 1.5em;
  color: rgba(159,177,195,0.7);
  font-size: 14px;
  letter-spacing: 0.01em;
}

@media (max-width: 650px) {
  #actions { width: 82vw; }
  .action { width: 100%; }
}
</style>
</head>
<body>

<div id="wrap">
  <div id="actions">
    <a id="start" class="action"
       href="slopkit/poops.html?go=1&amp;auto=1&amp;trigger=netcontrol&amp;payload=1&amp;v=17"
       tabindex="0">RUN</a>
  </div>
  <div id="status"></div>
</div>

<script>try {
    var q = new URLSearchParams(location.search);
    var start = document.getElementById("start");
    start.focus();
} catch (e) {}

try {
    document.getElementById("cat").addEventListener("error", function () {
        this.style.display = "none";
    });
} catch (e) {}
</script>

</body>
</html>
